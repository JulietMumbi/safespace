
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Share Something - SafeSpace</title>

    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>

<body>

    <nav class="navbar">

        <div class="logo">SafeSpace</div>

        <div class="nav-links">
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'logout' %}">Log Out</a>
        </div>

    </nav>

    <main class="form-container">

        <h1>Share Something</h1>

        <p class="form-description">
            Share what's on your mind with your fellow students.
            Your identity will remain anonymous.
        </p>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <!-- CATEGORY -->
            <div class="form-group">

                <label for="category">Category</label>

                <select id="category" name="category" required>

                    <option value="">Choose a category</option>

                    {% for category in categories %}

                        <option
                            value="{{ category.category_id }}"
                            {% if selected_category_id == category.category_id|stringformat:"s" %}
                                selected
                            {% endif %}
                        >
                            {{ category.name }}
                        </option>

                    {% endfor %}

                </select>

            </div>

            <!-- TITLE -->
            <div class="form-group">

                <label for="title">Title</label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Give your post a title"
                    maxlength="200"
                    required
                >

            </div>

            <!-- POST CONTENT -->
            <div class="form-group">

                <label for="content">What's on your mind?</label>

                <textarea
                    id="content"
                    name="content"
                    rows="8"
                    maxlength="2000"
                    placeholder="Share your thoughts here..."
                    required
                ></textarea>

                <div class="character-counter">
                    <span id="character-count">0</span>
                    / 2000 characters
                </div>

            </div>

            <!-- FORM BUTTONS -->
            <div class="form-footer">

                <a href="{% url 'dashboard' %}">
                    ← Back to Dashboard
                </a>

                <button type="submit" class="btn btn-primary">
                    Share Post
                </button>

            </div>

        </form>

    </main>

    <script>

        const postContent = document.getElementById('content');
        const characterCount = document.getElementById('character-count');
        const counterContainer = document.querySelector('.character-counter');

        function updateCharacterCount() {

            const length = postContent.value.length;

            characterCount.textContent = length;

            counterContainer.classList.remove('near-limit', 'at-limit');

            if (length >= 2000) {
                counterContainer.classList.add('at-limit');
            } else if (length >= 1800) {
                counterContainer.classList.add('near-limit');
            }

        }

        postContent.addEventListener('input', updateCharacterCount);

        updateCharacterCount();

    </script>

</body>
</html>
